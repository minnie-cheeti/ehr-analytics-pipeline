version: 2

models:
  - name: stg_patients
    description: Cleaned patient demographics
    columns:
      - name: patient_id
        description: Unique patient identifier
        tests:
          - unique
          - not_null
      - name: age
        description: Patient age in years
        tests:
          - not_null

  - name: stg_conditions
    description: Patient diagnoses and conditions
    columns:
      - name: condition_id
        tests:
          - unique
          - not_null
      - name: patient_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_patients')
              field: patient_id

  - name: stg_medications
    description: Active medication prescriptions
    columns:
      - name: medication_id
        tests:
          - unique
          - not_null

  - name: stg_observations
    description: Lab results and vital signs
    columns:
      - name: observation_id
        tests:
          - unique
          - not_null